<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Credentials Generator</title>
    <style>
        /* Import Aurek-Besh Font */
        @font-face {
            font-family: 'Aurek-Besh';
            src: url('https://raw.githubusercontent.com/jDPickering1010010/hostfiles/35316c0bcc4d02ef159b9847b15889729ef54386/fonts/Aurek-Besh.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-bg: #050505;
            --accent: #00f2ff;
            --card-bg: #111;
            --latin-font: 'Courier New', Courier, monospace;
            --aurebesh-font: 'Aurek-Besh', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: #fff;
            font-family: var(--latin-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .input-panel {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #333;
            width: 100%;
            max-width: 500px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
            box-sizing: border-box;
        }

        .controls {
            margin-bottom: 20px;
        }

        .swap-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        .swap-btn:hover {
            opacity: 0.8;
        }

        /* The Credentials Card */
        #credentials-card {
            background-color: var(--card-bg);
            border: 4px double var(--accent);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            position: relative;
            min-height: 300px;
        }

        .card-header {
            border-bottom: 1px solid var(--accent);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .data-field {
            margin-bottom: 25px;
        }

        .field-label {
            font-size: 0.7rem;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }

        /* Hot Swap Target Class */
        .swappable {
            font-size: 1.8rem;
            transition: all 0.2s ease;
        }

        /* Mode Toggles */
        .aurebesh-mode .swappable {
            font-family: var(--aurebesh-font);
            letter-spacing: 2px;
        }

        .latin-mode .swappable {
            font-family: var(--latin-font);
            letter-spacing: 0px;
        }

        .mode-indicator {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.6rem;
            color: var(--accent);
        }
    </style>
</head>
<body class="aurebesh-mode">

    <div class="input-panel">
        <h2 style="color: var(--accent); margin-top:0;">Generator Inputs</h2>
        <div class="input-group">
            <label>Captain Name</label>
            <input type="text" id="nameInput" value="James T. Kirk" oninput="updateCard()">
        </div>
        <div class="input-group">
            <label>Vessel Designation</label>
            <input type="text" id="shipInput" value="USS ENTERPRISE" oninput="updateCard()">
        </div>
        <div class="input-group">
            <label>Service ID</label>
            <input type="text" id="idInput" value="SC 937-0176" oninput="updateCard()">
        </div>
    </div>

    <div class="controls">
        <button class="swap-btn" onclick="toggleFont()">Hot Swap: Aurebesh / Latin</button>
    </div>

    <div id="credentials-card">
        <div class="mode-indicator" id="indicator">ENCRYPTION: ACTIVE (Aurebesh)</div>
        
        <div class="card-header">
            <span class="swappable" style="font-size: 1.2rem; color: var(--accent);">OFFICIAL SERVICE CREDENTIALS</span>
        </div>

        <div class="data-field">
            <span class="field-label">OFFICER NAME</span>
            <span class="swappable" id="cardName">James T. Kirk</span>
        </div>

        <div class="data-field">
            <span class="field-label">ASSIGNED VESSEL</span>
            <span class="swappable" id="cardShip">USS ENTERPRISE</span>
        </div>

        <div class="data-field">
            <span class="field-label">IDENTIFICATION CODE</span>
            <span class="swappable" id="cardID">SC 937-0176</span>
        </div>
    </div>

    <script>
        // Hot-swap toggle logic
        function toggleFont() {
            const body = document.body;
            const indicator = document.getElementById('indicator');
            
            if (body.classList.contains('aurebesh-mode')) {
                body.classList.remove('aurebesh-mode');
                body.classList.add('latin-mode');
                indicator.innerText = "ENCRYPTION: BYPASS (Latin Alphabet)";
            } else {
                body.classList.remove('latin-mode');
                body.classList.add('aurebesh-mode');
                indicator.innerText = "ENCRYPTION: ACTIVE (Aurebesh)";
            }
        }

        // Live update logic for the generator
        function updateCard() {
            document.getElementById('cardName').innerText = document.getElementById('nameInput').value;
            document.getElementById('cardShip').innerText = document.getElementById('shipInput').value;
            document.getElementById('cardID').innerText = document.getElementById('idInput').value;
        }

        // Initialize
        updateCard();
    </script>
</body>
</html>
