<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial License - Fixed GIF Export</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <style>
    @font-face {
      font-family: 'AurekBeshCanonical';
      src: url('https://raw.githubusercontent.com/jDPickering1010010/hostfiles/35316c0bcc4d02ef159b9847b15889729ef54386/fonts/Aurek-Besh.woff') format('woff');
    }

    body { font-family: sans-serif; background-color: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
    .container { background: #f4f4f9; color: #333; padding: 25px; border-radius: 15px; display: inline-block; max-width: 800px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: left; }
    input { padding: 5px; border: 1px solid #159; border-radius: 4px; width: 90%; }
    .button-group { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button, .upload-btn { background: #159; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    
    .preview-wrap { position: relative; width: 560px; height: 360px; margin: 20px auto; border-radius: 12px; overflow: hidden; }
    #result { display: block; background-color: #fff; }

    .mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,0,0,0.4), rgba(0,255,0,0.4), rgba(0,0,255,0.4), rgba(255,0,255,0.4));
      background-size: 200% 200%; animation: holo-animation1 3s ease infinite;
      -webkit-mask-image: url('https://i.ibb.co/xfYbzqN/hhholographic-3.png'); -webkit-mask-size: cover; -webkit-mask-mode: color-burn;
      mask-image: url('https://i.ibb.co/CpcPP5t7/new1maskalt3a-1-1.png'); mask-size: cover; mask-mode: color-dodge;
      mix-blend-mode: color-dodge; opacity: 0.9; 
    }

    @keyframes holo-animation1 { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    #status { margin-top: 10px; font-weight: bold; color: #ffcc00; height: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <form id="userForm">
      <h3>Imperial BoSS License Console</h3>
      <div class="form-grid">
        <div><label>Name</label><br><input type="text" id="inName" value="Thocas D'ire"></div>
        <div><label>Issue Date</label><br><input type="date" id="inIssue"></div>
        <div><label>Homeworld</label><br><input type="text" id="inHomeWorld" value="Coruscant"></div>
        <div><label>Species</label><br><input type="text" id="inSpecies" value="Human"></div>
        <div><label>Class</label><br><input type="text" id="inClass" value="Freighter"></div>
        <div><label>License #</label><br><input type="text" id="inNum" value="ISB-9920-A"></div>
        <div style="grid-column: span 2;">
          <label><input type="checkbox" id="toggleAurebesh" checked> Aurek-Besh</label>
          <label><input type="checkbox" id="toggleLayout"> Flip Layout</label>
        </div>
      </div>
      <div class="button-group">
        <label class="upload-btn">Upload Photo <input type="file" id="fileInput" accept="image/*" style="display:none"></label>
        <button type="button" id="randomButton">Randomizer</button>
        <button type="submit">Update</button>
      </div>
    </form>
  </div>

  <div class="preview-wrap">
    <canvas id="result" width="560" height="360"></canvas>
    <div class="mask"></div>
  </div>

  <div id="status"></div>
  <div class="button-group">
    <button id="downloadBtn" style="background:#444;">Save PNG</button>
    <button id="gifBtn" style="background:#800080;">Record GIF (Loop)</button>
  </div>

  <script>
    const canvas = document.getElementById("result");
    const ctx = canvas.getContext("2d");
    const statusDiv = document.getElementById("status");

    let userImage = null;
    const assets = {
      cardBase: 'https://i.ibb.co/6n2LXzc/card-Base-Imp02.png',
      imgLogo: 'https://i.ibb.co/5xM7hcd/logo-Imp001.png',
      upcLong: 'https://i.ibb.co/y6jhPxj/upc.png',
      upcTall: 'https://i.ibb.co/1KcZ9wF/upctall.png'
    };
    const images = {};

    Object.keys(assets).forEach(key => {
      images[key] = new Image();
      images[key].crossOrigin = "anonymous";
      images[key].src = assets[key];
    });

    images.cardBase.onload = () => drawCard();

    function fillScaledText(text, x, y, maxWidth, baseSize, fontFace) {
      let fontSize = baseSize;
      ctx.font = `bold ${fontSize}px ${fontFace}`;
      while (ctx.measureText(text).width > maxWidth && fontSize > 8) {
        fontSize--;
        ctx.font = `bold ${fontSize}px ${fontFace}`;
      }
      ctx.fillText(text, x, y);
    }

    function drawCard() {
      const useAurebesh = document.getElementById("toggleAurebesh").checked;
      const flip = document.getElementById("toggleLayout").checked;
      const fontFace = useAurebesh ? "AurekBeshCanonical" : "Arial";

      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,560,360);
      ctx.drawImage(images.cardBase,0,0,560,360);
      
      ctx.fillStyle = "#87CEEB"; ctx.fillRect(0,10,560,50);
      ctx.fillStyle = "#000"; ctx.textAlign = "center";
      fillScaledText("Imperial Bureau of Ships and Services", 280, 32, 440, 18, fontFace);
      
      const photoX = flip ? 390 : 10;
      const textX = flip ? 25 : 185;
      if (userImage) ctx.drawImage(userImage, photoX, 75, 160, 240);
      
      ctx.textAlign = "left"; ctx.fillStyle = "#112255";
      const fields = [
        `NAME: ${document.getElementById("inName").value}`,
        `DATE: ${document.getElementById("inIssue").value}`,
        `WORLD: ${document.getElementById("inHomeWorld").value}`,
        `SPECIES: ${document.getElementById("inSpecies").value}`,
        `CLASS: ${document.getElementById("inClass").value}`,
        `ID: ${document.getElementById("inNum").value}`
      ];
      fields.forEach((t, i) => fillScaledText(t.toUpperCase(), textX, 105 + (i*35), 350, 15, fontFace));
      ctx.drawImage(images.upcLong, 15, 320, 530, 25);
    }

    // --- GIF LOGIC ---
    document.getElementById("gifBtn").addEventListener("click", async () => {
      statusDiv.innerText = "Encoding... Please wait.";
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = 560; tempCanvas.height = 360;
      const tCtx = tempCanvas.getContext("2d");

      const gif = new GIF({
        workers: 4, quality: 10, width: 560, height: 360,
        workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
      });

      const maskImg = new Image();
      maskImg.crossOrigin = "anonymous";
      maskImg.src = 'https://i.ibb.co/CpcPP5t7/new1maskalt3a-1-1.png';
      await new Promise(r => maskImg.onload = r);

      for (let i = 0; i < 30; i++) {
        tCtx.clearRect(0,0,560,360);
        tCtx.drawImage(canvas, 0, 0);
        tCtx.globalCompositeOperation = 'color-dodge';
        const p = i / 30;
        const g = tCtx.createLinearGradient(0,0,560,360);
        g.addColorStop(0, `hsla(${p*360}, 100%, 50%, 0.4)`);
        g.addColorStop(1, `hsla(${(p*360+180)%360}, 100%, 50%, 0.4)`);
        tCtx.fillStyle = g; tCtx.fillRect(0,0,560,360);
        tCtx.globalCompositeOperation = 'destination-in';
        tCtx.drawImage(maskImg, 0, 0, 560, 360);
        tCtx.globalCompositeOperation = 'source-over';
        
        gif.addFrame(tCtx, {copy: true, delay: 100});
        statusDiv.innerText = `Captured ${i+1}/30`;
      }

      gif.on('finished', (blob) => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "Imperial_License.gif";
        link.click();
        statusDiv.innerText = "Download complete.";
      });

      statusDiv.innerText = "Compiling GIF...";
      gif.render();
    });

    // Inputs
    document.querySelectorAll('input').forEach(el => el.addEventListener('input', drawCard));
    document.getElementById("userForm").onsubmit = (e) => { e.preventDefault(); drawCard(); };
    document.getElementById("fileInput").onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        userImage = new Image();
        userImage.onload = () => drawCard();
        userImage.src = ev.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    };
    document.getElementById("downloadBtn").onclick = () => {
      const a = document.createElement("a");
      a.download = "License.png"; a.href = canvas.toDataURL(); a.click();
    };
  </script>
</body>
</html>
