<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Bureau of Ships and Services Captain's Accreditation License Generator</title>
  <style>

    @font-face {
      font-family: 'Aurek-Besh';
      src: url('https://raw.githubusercontent.com/jDPickering1010010/hostfiles/35316c0bcc4d02ef159b9847b15889729ef54386/fonts/Aurek-Besh.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: "Arial", sans-serif;
      background-color: #1a1a2e;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    #fontLoader { font-family: 'Aurek-Besh'; visibility: hidden; position: absolute; }

    .container {
      background: #f4f4f9;
      color: #333;
      padding: 25px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 4px 25px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      max-width: 800px;
    }

    h3 { color: #159; margin-top: 0; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: left; }
    .form-section { border-top: 1px solid #ccc; margin-top: 15px; padding-top: 10px; grid-column: span 2; font-weight: bold; color: #159; }
    label { font-size: 13px; font-weight: bold; }
    input { padding: 5px; border: 1px solid #159; border-radius: 4px; width: 90%; }
    input[type="color"] { width: 40px; height: 25px; padding: 1px; }

    .button-group { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button, .upload-btn { background: #159; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0b3d61; }

    #swapBtn {
      background: #c40000;
      border: 2px solid #fff;
    }
    
    #layoutSwapBtn {
        background: #e67e22; /* Orange for distinction */
        border: 2px solid #fff;
    }

    .preview-wrap {
      position: relative;
      width: 560px;
      height: 360px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    #result {
      display: block;
      background-color: #fff;
    }

    .mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(255, 0, 0, 0.4), rgba(0, 255, 0, 0.4), rgba(0, 0, 255, 0.4), rgba(255, 0, 255, 0.4));
      background-size: 200% 200%;
      animation: holo-animation1 3s ease infinite;
      -webkit-mask-image: url('https://i.ibb.co/xfYbzqN/hhholographic-3.png');
      -webkit-mask-size: cover;
      -webkit-mask-mode: color-burn;
      mask-image: url('https://i.ibb.co/CpcPP5t7/new1maskalt3a-1-1.png');
      mask-size: cover;
      mask-mode: color-dodge;
      mix-blend-mode: color-dodge;
    }

    @keyframes holo-animation1 {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <div id="fontLoader">ABC abc 123</div>

  <div class="container">
    <form id="userForm">
      <h3>Imperial Bureau of Ships and Services</h3>
      
      <div class="form-grid">
        <div><label>Full Name</label><br><input type="text" id="inName" placeholder="Name" value="Han Solo"></div>
        <div><label>Date of Issue</label><br><input type="date" id="inIssue"></div>
        <div><label>Homeworld</label><br><input type="text" id="inHomeWorld" placeholder="Planet" value="Corellia"></div>
        <div><label>Species</label><br><input type="text" id="inSpecies" placeholder="Species" value="Human"></div>
        <div><label>Ship Class</label><br><input type="text" id="inClass" placeholder="Class" value="YT-1300"></div>
        <div><label>BoSS License #</label><br><input type="text" id="inNum" placeholder="ID Number" value="ISB-9920-A"></div>

        <div class="form-section">Visual Stylization</div>
        <div>
          <label>Header Gradients</label><br>
          <input type="color" id="gradColor1" value="#87CEEB">
          <input type="color" id="gradColor2" value="#4682B4">
          <input type="color" id="gradColor3" value="#4682B4">
          <input type="color" id="gradColor4" value="#4682B4">
          <input type="color" id="gradColor5" value="#4682B4">
        </div>
        <div>
          <label>Visual Accents</label><br>
          <input type="color" id="textColor1" value="#000000">
          <input type="color" id="textColor2" value="#112255">
          <input type="color" id="patternColor" value="#4682B4">
        </div>
      </div>

      <div class="button-group">
        <label class="upload-btn">Upload Photo <input type="file" id="fileInput" accept="image/*" style="display:none"></label>
        <button type="button" id="randomButton">Lore Randomizer</button>
        <button type="button" id="swapBtn">HOT SWAP: Latin / Aurebesh</button>
        <button type="button" id="layoutSwapBtn">HOT SWAP: Layout (L/R)</button>
        <button type="button" id="saveButton">Export CSV</button>
        <input type="file" id="loadButton" accept=".csv" style="display:none">
        <button type="button" onclick="document.getElementById('loadButton').click()">Import CSV</button>
        <button type="submit" style="background: #28a745;">Apply All Changes</button>
      </div>
    </form>
  </div>

  <br>
  <div class="preview-wrap">
    <canvas id="result" width="560" height="360"></canvas>
    <div class="mask"></div>
  </div>

  <br>
  <button id="downloadBtn" style="background:#444; font-size: 18px; margin-bottom: 40px;">Download Static PNG</button>

  <script>
    const canvas = document.getElementById("result");
    const ctx = canvas.getContext("2d");

    // Hot Swap States
    let activeFont = "Arial";
    let sizeMultiplier = 1.0; // Latin is 1:1 scale
    let isLayoutSwapped = false; // False = Image Left, Text Right. True = Text Left, Image Right.

    let userImage = null;
    const imgLogo = new Image();
    const upcLong = new Image();
    const upcTall = new Image();
    const cardBase = new Image();

    [imgLogo, upcLong, upcTall, cardBase].forEach(a => a.crossOrigin = "anonymous");

    cardBase.src = 'https://i.ibb.co/6n2LXzc/card-Base-Imp02.png';
    imgLogo.src = 'https://i.ibb.co/5xM7hcd/logo-Imp001.png';
    upcLong.src = 'https://i.ibb.co/y6jhPxj/upc.png';
    upcTall.src = 'https://i.ibb.co/1KcZ9wF/upctall.png';

    cardBase.onload = () => drawCard();

    function drawCard() {
      // 1. Determine Positions based on Layout State
      let imageX, upcTallX, textX;
      
      if (isLayoutSwapped) {
          // Layout: Text on LEFT, Image on RIGHT
          textX = 20; // Padding from left edge
          imageX = 390; // Canvas width (560) - Image Width (160) - padding (10)
          upcTallX = 515; // imageX + 125 relative offset
      } else {
          // Layout: Image on LEFT, Text on RIGHT (Standard)
          imageX = 10;
          upcTallX = 135;
          textX = 185;
      }


      // 2. Begin Drawing
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 560, 360);
      ctx.drawImage(cardBase, 0, 0, 560, 360);

      // Header Gradients
      const grad = ctx.createLinearGradient(0, 10, 0, 60);
      grad.addColorStop(0, document.getElementById("gradColor1").value);
      grad.addColorStop(0.25, document.getElementById("gradColor2").value);
      grad.addColorStop(0.5, document.getElementById("gradColor3").value);
      grad.addColorStop(0.75, document.getElementById("gradColor4").value);
      grad.addColorStop(1, document.getElementById("gradColor5").value);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 10, 560, 50);

      ctx.strokeStyle = document.getElementById("patternColor").value;
      ctx.lineWidth = 0.5;
      for (let i = 10; i <= 60; i += 5) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(560, i); ctx.stroke();
      }

      // Header Text (Center Top)
      ctx.fillStyle = document.getElementById("textColor1").value;
      ctx.textAlign = "center";
      // Dynamic Scaling for Header
      ctx.font = `bold ${18 * sizeMultiplier}px ${activeFont}`;
      ctx.fillText("Imperial Bureau of Ships and Services", 280, 32);
      
      ctx.font = `${14 * sizeMultiplier}px ${activeFont}`;
      ctx.fillText("CAPTAIN'S ACCREDITED LICENSE", 280, 52);

      // Logos
      ctx.drawImage(imgLogo, 10, 11, 48, 48);
      ctx.drawImage(imgLogo, 502, 11, 48, 48);

      // 3. Draw User Image at calculated position
      if (userImage) {
        // Use dynamic imageX
        ctx.drawImage(userImage, imageX, 75, 160, 240);
        ctx.globalAlpha = 0.4;
        // Use dynamic upcTallX
        ctx.drawImage(upcTall, upcTallX, 80, 30, 230);
        ctx.globalAlpha = 1.0;
      }

      // 4. Draw Text Fields at calculated position
      ctx.textAlign = "left";
      ctx.fillStyle = document.getElementById("textColor2").value;
      
      // Dynamic Scaling for Labels/Data
      ctx.font = `bold ${16 * sizeMultiplier}px ${activeFont}`;
      
      // Use dynamic textX
      ctx.fillText(`NAME: ${document.getElementById("inName").value.toUpperCase()}`, textX, 105);
      ctx.fillText(`ISSUE DATE: ${document.getElementById("inIssue").value}`, textX, 140);
      ctx.fillText(`HOMEWORLD: ${document.getElementById("inHomeWorld").value}`, textX, 175);
      ctx.fillText(`SPECIES: ${document.getElementById("inSpecies").value}`, textX, 210);
      ctx.fillText(`SHIP CLASS: ${document.getElementById("inClass").value}`, textX, 245);
      ctx.fillText(`BoSS LICENSE #: ${document.getElementById("inNum").value}`, textX, 280);

      // Bottom UPC
      ctx.drawImage(upcLong, 15, 320, 530, 25);

      // Holo Overlay
      ctx.globalCompositeOperation = 'soft-light';
      const holo = ctx.createLinearGradient(0, 0, 560, 360);
      holo.addColorStop(0, "rgba(255, 0, 0, 0.1)");
      holo.addColorStop(0.5, "rgba(0, 255, 0, 0.1)");
      holo.addColorStop(1, "rgba(0, 0, 255, 0.1)");
      ctx.fillStyle = holo;
      ctx.fillRect(0, 0, 560, 360);
      ctx.globalCompositeOperation = 'source-over';
    }

    // FONT Toggle logic with size scaling
    document.getElementById("swapBtn").addEventListener("click", () => {
      if (activeFont === "Arial") {
        activeFont = "'Aurek-Besh'";
        sizeMultiplier = 0.6; // Reduction scale
      } else {
        activeFont = "Arial";
        sizeMultiplier = 1.0; // Reset scale
      }
      drawCard();
    });

    // LAYOUT Toggle logic (New)
    document.getElementById("layoutSwapBtn").addEventListener("click", () => {
        isLayoutSwapped = !isLayoutSwapped;
        drawCard();
    });

    // Event Listeners for inputs
    const styleInputs = ["gradColor1", "gradColor2", "gradColor3", "gradColor4", "gradColor5", "textColor1", "textColor2", "patternColor"];
    styleInputs.forEach(id => {
      document.getElementById(id).addEventListener("input", drawCard);
    });

    document.getElementById("randomButton").addEventListener("click", () => {
      const db = [{s:"Human",w:"Corellia",n:["Dash Rendar","Han Solo"]},{s:"Wookiee",w:"Kashyyyk",n:["Chewbacca","Tarfful"]}];
      const e = db[Math.floor(Math.random()*db.length)];
      document.getElementById("inSpecies").value = e.s;
      document.getElementById("inHomeWorld").value = e.w;
      document.getElementById("inName").value = e.n[Math.floor(Math.random()*e.n.length)];
      document.getElementById("inIssue").valueAsDate = new Date();
      document.getElementById("inNum").value = "ISB-"+Math.random().toString(36).substr(2,6).toUpperCase();
      drawCard();
    });

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        userImage = new Image();
        userImage.onload = () => drawCard();
        userImage.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById("userForm").addEventListener("submit", (e) => { e.preventDefault(); drawCard(); });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `Imperial_License_${document.getElementById("inName").value || 'Card'}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  </script>
</body>
</html>
