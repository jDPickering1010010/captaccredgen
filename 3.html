<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial License - High Fidelity GIF Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <style>
    @font-face {
      font-family: 'AurekBeshCanonical';
      src: url('https://raw.githubusercontent.com/jDPickering1010010/hostfiles/35316c0bcc4d02ef159b9847b15889729ef54386/fonts/Aurek-Besh.woff') format('woff');
    }

    body { font-family: sans-serif; background-color: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
    .container { background: #f4f4f9; color: #333; padding: 25px; border-radius: 15px; display: inline-block; max-width: 800px; box-shadow: 0 4px 25px rgba(0,0,0,0.5); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: left; }
    .form-section { border-top: 1px solid #ccc; margin-top: 15px; padding-top: 10px; grid-column: span 2; font-weight: bold; color: #159; }
    input { padding: 5px; border: 1px solid #159; border-radius: 4px; width: 90%; }
    input[type="color"] { width: 40px; height: 25px; padding: 1px; }

    .preview-wrap { position: relative; width: 560px; height: 360px; margin: 20px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    #result { display: block; background-color: #fff; }

    .mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,0,0,0.4), rgba(0,255,0,0.4), rgba(0,0,255,0.4), rgba(255,0,255,0.4));
      background-size: 200% 200%; animation: holo-animation 3s ease infinite;
      -webkit-mask-image: url('https://i.ibb.co/xfYbzqN/hhholographic-3.png'); -webkit-mask-size: cover; -webkit-mask-mode: color-burn;
      mask-image: url('https://i.ibb.co/CpcPP5t7/new1maskalt3a-1-1.png'); mask-size: cover; mask-mode: color-dodge;
      mix-blend-mode: color-dodge; opacity: 0.9; 
    }
    @keyframes holo-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    #status { margin-top: 10px; font-weight: bold; color: #ffcc00; }
    .button-group { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button, .upload-btn { background: #159; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <form id="userForm">
      <h3>Imperial BoSS License Console</h3>
      <div class="form-grid">
        <div><label>Full Name</label><input type="text" id="inName" value="Han Solo"></div>
        <div><label>Issue Date</label><input type="date" id="inIssue"></div>
        <div><label>Homeworld</label><input type="text" id="inHomeWorld" value="Corellia"></div>
        <div><label>Species</label><input type="text" id="inSpecies" value="Human"></div>
        <div><label>Ship Class</label><input type="text" id="inClass" value="YT-1300"></div>
        <div><label>BoSS #</label><input type="text" id="inNum" value="ISB-9920-A"></div>
        
        <div class="form-section">Visual Styling</div>
        <div><label><input type="checkbox" id="toggleAurebesh" checked> Use Aurebesh</label></div>
        <div><label><input type="checkbox" id="toggleLayout"> Flip Layout</label></div>
        <div>
          <label>Header Gradient</label><br>
          <input type="color" id="gradColor1" value="#87CEEB"> <input type="color" id="gradColor2" value="#4682B4">
          <input type="color" id="gradColor3" value="#4682B4"> <input type="color" id="gradColor4" value="#4682B4">
          <input type="color" id="gradColor5" value="#4682B4">
        </div>
        <div>
          <label>Accents</label><br>
          <input type="color" id="textColor1" value="#000000"> <input type="color" id="textColor2" value="#112255">
          <input type="color" id="patternColor" value="#4682B4">
        </div>
      </div>
      <div class="button-group">
        <label class="upload-btn">Upload Photo <input type="file" id="fileInput" accept="image/*" style="display:none"></label>
        <button type="button" id="randomButton">Lore Randomizer</button>
        <button type="submit" style="background: #28a745;">Update Preview</button>
      </div>
    </form>
  </div>

  <div class="preview-wrap">
    <canvas id="result" width="560" height="360"></canvas>
    <div class="mask"></div>
  </div>

  <div id="status"></div>
  <div class="button-group">
    <button id="downloadBtn" style="background:#444;">Download PNG</button>
    <button id="gifBtn" style="background:#800080;">Export Animated GIF</button>
  </div>

  <script>
    const canvas = document.getElementById("result"), ctx = canvas.getContext("2d"), statusDiv = document.getElementById("status");
    let userImage = null;
    const assets = { b: 'https://i.ibb.co/6n2LXzc/card-Base-Imp02.png', l: 'https://i.ibb.co/5xM7hcd/logo-Imp001.png', u: 'https://i.ibb.co/y6jhPxj/upc.png', t: 'https://i.ibb.co/1KcZ9wF/upctall.png' };
    const imgs = {};
    Object.keys(assets).forEach(k => { imgs[k] = new Image(); imgs[k].crossOrigin = "anonymous"; imgs[k].src = assets[k]; });
    
    document.fonts.ready.then(() => { imgs.b.onload = () => drawCard(); });

    function fillScaledText(text, x, y, maxW, baseS, fontF) {
      let s = baseS; ctx.font = `bold ${s}px ${fontF}`;
      while (ctx.measureText(text).width > maxW && s > 8) { s--; ctx.font = `bold ${s}px ${fontF}`; }
      ctx.fillText(text, x, y);
    }

    function drawCard() {
      const aur = document.getElementById("toggleAurebesh").checked, flip = document.getElementById("toggleLayout").checked, f = aur ? "AurekBeshCanonical" : "Arial";
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,560,360); ctx.drawImage(imgs.b, 0, 0, 560, 360);
      
      const grad = ctx.createLinearGradient(0,10,0,60);
      for(let i=1; i<=5; i++) grad.addColorStop((i-1)*0.25, document.getElementById(`gradColor${i}`).value);
      ctx.fillStyle = grad; ctx.fillRect(0, 10, 560, 50);
      
      ctx.strokeStyle = document.getElementById("patternColor").value; ctx.lineWidth = 0.5;
      for(let i=10; i<=60; i+=5){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(560,i); ctx.stroke(); }
      
      ctx.fillStyle = document.getElementById("textColor1").value; ctx.textAlign = "center";
      fillScaledText("Imperial Bureau of Ships and Services", 280, 32, 440, 18, f);
      ctx.drawImage(imgs.l, 10, 11, 48, 48); ctx.drawImage(imgs.l, 502, 11, 48, 48);
      
      const pX = flip ? 390 : 10, tX = flip ? 25 : 185;
      if (userImage) ctx.drawImage(userImage, pX, 75, 160, 240);
      
      ctx.textAlign = "left"; ctx.fillStyle = document.getElementById("textColor2").value;
      const d = [document.getElementById("inName").value, document.getElementById("inIssue").value, document.getElementById("inHomeWorld").value, document.getElementById("inSpecies").value, document.getElementById("inClass").value, document.getElementById("inNum").value];
      const lbl = ["NAME: ","DATE: ","WORLD: ","SPECIES: ","CLASS: ","ID: "];
      d.forEach((v, i) => fillScaledText((lbl[i]+v).toUpperCase(), tX, 105+(i*35), 350, 15, f));
      ctx.drawImage(imgs.u, 15, 320, 530, 25);
    }

    document.getElementById("gifBtn").onclick = async () => {
      statusDiv.innerText = "Initializing GIF... (Bypassing CORS)";
      const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
      const blob = await response.blob();
      const workerUrl = URL.createObjectURL(blob);
      
      const gif = new GIF({ workers: 2, quality: 10, width: 560, height: 360, workerScript: workerUrl });
      const mImg = new Image(); mImg.crossOrigin = "anonymous"; mImg.src = 'https://i.ibb.co/CpcPP5t7/new1maskalt3a-1-1.png';
      await new Promise(r => mImg.onload = r);

      // We need two temporary canvases to prevent the mask from deleting the background
      const mainTemp = document.createElement("canvas"); mainTemp.width = 560; mainTemp.height = 360;
      const mTX = mainTemp.getContext("2d");
      const holoTemp = document.createElement("canvas"); holoTemp.width = 560; holoTemp.height = 360;
      const hTX = holoTemp.getContext("2d");

      for (let i = 0; i < 30; i++) {
        // 1. Draw static card to main temp
        mTX.clearRect(0,0,560,360);
        mTX.drawImage(canvas, 0, 0);

        // 2. Prepare holographic shimmer on separate layer
        hTX.clearRect(0,0,560,360);
        const p = i/30, g = hTX.createLinearGradient(0,0,560,360);
        g.addColorStop(0, `hsla(${p*360}, 100%, 50%, 0.4)`);
        g.addColorStop(1, `hsla(${(p*360+180)%360}, 100%, 50%, 0.4)`);
        hTX.fillStyle = g; hTX.fillRect(0,0,560,360);

        // 3. Mask the shimmer layer
        hTX.globalCompositeOperation = 'destination-in';
        hTX.drawImage(mImg, 0, 0, 560, 360);
        hTX.globalCompositeOperation = 'source-over';

        // 4. Blend shimmer onto the card
        mTX.globalCompositeOperation = 'color-dodge';
        mTX.drawImage(holoTemp, 0, 0);
        mTX.globalCompositeOperation = 'source-over';

        gif.addFrame(mTX, {copy: true, delay: 100});
        statusDiv.innerText = `Recording: ${Math.round((i/30)*100)}%`;
      }

      gif.on('finished', b => { 
        const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "Imperial_ID.gif"; a.click(); 
        statusDiv.innerText = "Ready.";
      });
      gif.render();
    };

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', drawCard));
    document.getElementById("randomButton").onclick = () => {
      document.getElementById("inName").value = ["Dash Rendar","Han Solo","Thocas D'ire"][Math.floor(Math.random()*3)];
      drawCard();
    };
    document.getElementById("fileInput").onchange = (e) => {
      const r = new FileReader(); r.onload = (v) => { userImage = new Image(); userImage.onload = () => drawCard(); userImage.src = v.target.result; }; r.readAsDataURL(e.target.files[0]);
    };
    document.getElementById("downloadBtn").onclick = () => { const a = document.createElement("a"); a.download = "Imperial_ID.png"; a.href = canvas.toDataURL(); a.click(); };
  </script>
</body>
</html>
